name: Java CI with Gradle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down the source code from your repo
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Install the JDK and auto-cache Gradle dependencies
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'       # Change to '21' or your specific Java version if needed
        distribution: 'temurin'
        cache: gradle

    # 3. Ensure the runner has permission to execute the Gradle wrapper script
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Compile code, run tests, and build the fat/shadow JAR
    - name: Build and Test with Gradle
      run: ./gradlew build

    - name: Run and output to console
      run: ./gradlew run